# docker-compose.ci.yml
#
# Ephemeral stack used ONLY by the CI "docker-connectivity" job.
# Local dev should keep using scripts/dev.sh / your existing docker-compose
# setup — this file exists purely to prove every container can see every
# other container before code merges, not to replace local dev tooling.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spikeclip
      POSTGRES_PASSWORD: spikeclip
      POSTGRES_DB: spikeclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spikeclip"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spikeclip
      MINIO_ROOT_PASSWORD: spikeclip123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: spikeclip-api:ci
    environment:
      DATABASE_URL: postgresql://spikeclip:spikeclip@postgres:5432/spikeclip
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: spikeclip
      MINIO_SECRET_KEY: spikeclip123
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

  web:
    image: spikeclip-web:ci
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      INTERNAL_API_URL: http://api:3001
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s