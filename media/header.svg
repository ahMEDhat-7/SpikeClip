<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#ef4444;#a855f7;#3b82f6;#f97316" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ef4444">
        <animate attributeName="stop-color" values="#ef4444;#a855f7;#3b82f6;#f97316;#ef4444" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#f97316;#ef4444;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="33%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="66%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="12" fill="#0f0a1a"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="190" x2="800" y2="190"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="100" y1="100" x2="100" y2="220"/>
    <line x1="200" y1="100" x2="200" y2="220"/>
    <line x1="300" y1="100" x2="300" y2="220"/>
    <line x1="400" y1="100" x2="400" y2="220"/>
    <line x1="500" y1="100" x2="500" y2="220"/>
    <line x1="600" y1="100" x2="600" y2="220"/>
    <line x1="700" y1="100" x2="700" y2="220"/>
  </g>

  <!-- Title: SpikeClip -->
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="64" fill="url(#titleGrad)" filter="url(#glow)">
    SpikeClip
    <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="108" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="3">
    FIND WHAT VIEWERS ACTUALLY REWATCH
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Heatmap bars — each bar animates its height independently -->
  <!-- Bar 1 -->
  <rect x="40" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="15;55;30;70;20;45;15" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="205;165;180;140;200;175;205" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 2 -->
  <rect x="66" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="30;70;50;20;65;35;30" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;150;170;200;155;185;190" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 3 -->
  <rect x="92" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="55;25;70;40;15;60;55" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="165;195;150;180;205;160;165" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 4 -->
  <rect x="118" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="40;65;20;55;70;30;40" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;155;200;165;150;190;180" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 5 -->
  <rect x="144" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="20;50;70;35;55;25;20" dur="4.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="200;170;150;185;165;195;200" dur="4.0s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 6 -->
  <rect x="170" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="60;30;45;70;20;55;60" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="160;190;175;150;200;165;160" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 7 -->
  <rect x="196" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="35;60;25;50;45;70;35" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="185;160;195;170;175;150;185" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 8 -->
  <rect x="222" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="50;20;65;30;60;40;50" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="170;200;155;190;160;180;170" dur="4.3s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 9 -->
  <rect x="248" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="25;55;40;65;30;50;25" dur="3.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="195;165;180;155;190;170;195" dur="3.9s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 10 -->
  <rect x="274" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="45;70;25;50;35;60;45" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="175;150;195;170;185;160;175" dur="4.1s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 11 (center peak) -->
  <rect x="300" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="70;50;65;45;70;55;70" dur="3.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="150;170;155;175;150;165;150" dur="3.7s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 12 -->
  <rect x="326" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="60;35;50;65;40;55;60" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="160;185;170;155;180;165;160" dur="4.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 13 -->
  <rect x="352" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="40;65;30;55;70;25;40" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;155;190;165;150;195;180" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 14 -->
  <rect x="378" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="55;25;60;35;45;70;55" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="165;195;160;185;175;150;165" dur="4.4s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 15 -->
  <rect x="404" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="30;55;45;70;25;50;30" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;165;175;150;195;170;190" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 16 -->
  <rect x="430" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="65;40;55;30;60;45;65" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="155;180;165;190;160;175;155" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 17 -->
  <rect x="456" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="35;60;25;50;55;30;35" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="185;160;195;170;165;190;185" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 18 -->
  <rect x="482" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="50;30;65;40;20;55;50" dur="4.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="170;190;155;180;200;165;170" dur="4.7s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 19 -->
  <rect x="508" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="20;45;70;35;55;25;20" dur="3.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="200;175;150;185;165;195;200" dur="3.9s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 20 -->
  <rect x="534" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="55;70;30;60;40;50;55" dur="4.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="165;150;190;160;180;170;165" dur="4.0s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 21 -->
  <rect x="560" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="40;25;55;70;35;60;40" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;195;165;150;185;160;180" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 22 -->
  <rect x="586" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="60;45;35;50;65;30;60" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="160;175;185;170;155;190;160" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 23 -->
  <rect x="612" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="25;55;65;30;50;70;25" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="195;165;155;190;170;150;195" dur="4.3s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 24 -->
  <rect x="638" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="45;30;50;65;35;55;45" dur="3.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="175;190;170;155;185;165;175" dur="3.7s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 25 -->
  <rect x="664" y="190" width="18" height="0" rx="2" fill="url(#bar1)">
    <animate attributeName="height" values="35;60;20;45;55;40;35" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="185;160;200;175;165;180;185" dur="4.1s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 26 -->
  <rect x="690" y="190" width="18" height="0" rx="2" fill="url(#bar2)">
    <animate attributeName="height" values="50;35;60;25;40;55;50" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="170;185;160;195;180;165;170" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 27 -->
  <rect x="716" y="190" width="18" height="0" rx="2" fill="url(#bar3)">
    <animate attributeName="height" values="30;50;40;55;65;25;30" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;170;180;165;155;195;190" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <!-- Bar 28 -->
  <rect x="742" y="190" width="18" height="0" rx="2" fill="url(#bar4)">
    <animate attributeName="height" values="45;25;55;35;50;60;45" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="175;195;165;185;170;160;175" dur="4.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving playhead line across heatmap -->
  <line x1="0" y1="115" x2="0" y2="218" stroke="#f97316" stroke-width="2" opacity="0.7">
    <animate attributeName="x1" values="30;770;30" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="30;770;30" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- Pulse dot at playhead tip -->
  <circle cx="0" cy="115" r="4" fill="#f97316" opacity="0.9">
    <animate attributeName="cx" values="30;770;30" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
